<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bluetooth smartwatch heart rate monitor and MIDI clock" />
    <meta
      name="theme-color"
      content="#26262a" />
    <link
      rel="author"
      href="./humans.txt" />
    <title>MIDI of Hearts</title>
    <link
      rel="preload"
      href="./fonts/TulpenOne-Regular.ttf"
      as="font"
      crossorigin />
    <link
      rel="icon"
      href="./favicon.ico"
      sizes="48x48" />
    <link
      rel="icon"
      href="./logo.svg"
      sizes="any"
      type="image/svg+xml" />
    <link
      rel="apple-touch-icon"
      href="./apple-touch-icon-180x180.png" />
    <style>
      @font-face {
        font-family: 'Tulpen One';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/TulpenOne-Regular.ttf) format('truetype');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212,
          U+2215, U+FEFF, U+FFFD;
      }

      html,
      body {
        height: 100%;
        background: #26262a;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #loading {
        position: absolute;
        top: 46.5%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #e4e5e5;
        font-size: 2rem;
        letter-spacing: 0.055em;
        opacity: 0.6;
        font-family: 'Tulpen One', sans-serif;
      }
      #hide {
        position: absolute;
        user-select: none;
      }
      #hide,
      #hide a,
      #hide a:visited {
        color: #26262a;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="loading">Loading</p>
      <div id="hide">
        <h1>MIDI of Hearts</h1>
        <p class="hide">Bluetooth smartwatch heart rate monitor and MIDI clock. <a href="https://github.com/darosh/midi-of-hearts">GitHub</a></p>
      </div>
    </main>
    <noscript>MIDI of Hearts requires JavaScript and browser with Web Bluetooth, Audio and MIDI support.</noscript>
    <script
      type="module"
      src="./src/main.ts"></script>
  </body>
</html>
